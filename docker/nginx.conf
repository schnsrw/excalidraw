server {
  listen 8080;

  location /socket.io/ {
    proxy_pass http://excalidraw-room;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://excalidraw;
  }

  # Forward /api/* to storage backend and strip the /api prefix
  location /api/ {
    proxy_pass http://excalidraw-storage-backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /excalidraw/ {
    # IMPORTANT: trailing slash so /excalidraw/foo -> /foo on upstream
    proxy_pass http://excalidraw/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # DO NOT use try_files here; we are not serving local files.
  }
}
